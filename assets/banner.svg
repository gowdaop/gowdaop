<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="KS Vignesh - backend and applied AI, Bengaluru">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0A0E1A"/>
      <stop offset="50%"  stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#141024"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE"/>
      <stop offset="45%"  stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.3 0; 0.3 0; -0.3 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#818CF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1E2536" stroke-width="1"/>
    </pattern>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <clipPath id="typeClip">
      <rect x="72" y="204" width="392" height="30">
        <animate attributeName="width" values="0;0;392;392;0"
                 keyTimes="0;0.08;0.52;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="340" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity="0.5"/>
    <ellipse cx="905" cy="165" rx="330" ry="195" fill="url(#glow)"/>

    <rect x="-260" y="0" width="260" height="340" fill="url(#hair)" opacity="0.10">
      <animate attributeName="x" values="-260;1200" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- ── neural graph ── -->
    <g stroke="url(#accent)" stroke-width="1.3" fill="none" opacity="0.6">
      <path d="M812 78 L906 138 M812 78 L878 214 M906 138 L878 214 M906 138 L1012 102
               M906 138 L1004 222 M878 214 L1004 222 M1012 102 L1004 222 M1004 222 L1096 164
               M1012 102 L1096 164 M878 214 L936 288 M936 288 L1004 222 M812 78 L744 164
               M744 164 L878 214 M744 164 L906 138"
            stroke-dasharray="1500" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="1500;0" dur="2.8s" fill="freeze"/>
      </path>
    </g>

    <g fill="#0D1117" stroke="url(#accent)" stroke-width="2">
      <circle cx="812"  cy="78"  r="5"><animate attributeName="r" values="5;8;5"   dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="906"  cy="138" r="6"><animate attributeName="r" values="6;9.5;6" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="878"  cy="214" r="5"><animate attributeName="r" values="5;8;5"   dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1012" cy="102" r="4"><animate attributeName="r" values="4;7;4"   dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="1004" cy="222" r="6"><animate attributeName="r" values="6;9;6"   dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="1096" cy="164" r="4"><animate attributeName="r" values="4;7;4"   dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="936"  cy="288" r="4"><animate attributeName="r" values="4;6.5;4" dur="4.0s" repeatCount="indefinite"/></circle>
      <circle cx="744"  cy="164" r="5"><animate attributeName="r" values="5;8;5"   dur="3.4s" repeatCount="indefinite"/></circle>
    </g>

    <g>
      <circle r="3.4" fill="#22D3EE" filter="url(#soft)">
        <animateMotion dur="4.2s" repeatCount="indefinite" path="M812 78 L906 138 L1004 222 L1096 164"/>
      </circle>
      <circle r="3.4" fill="#F472B6" filter="url(#soft)">
        <animateMotion dur="5.4s" repeatCount="indefinite" path="M744 164 L878 214 L936 288"/>
      </circle>
      <circle r="2.8" fill="#818CF8" filter="url(#soft)">
        <animateMotion dur="6.1s" repeatCount="indefinite" path="M1012 102 L906 138 L812 78"/>
      </circle>
    </g>

    <!-- ── type ── -->
    <text x="74" y="104" font-family="'SF Mono','JetBrains Mono',Consolas,monospace"
          font-size="14" letter-spacing="5.5" fill="#5B6478">BACKEND · APPLIED AI</text>

    <text x="70" y="180" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="74" font-weight="700" letter-spacing="-1" fill="url(#accent)">KS VIGNESH</text>

    <g clip-path="url(#typeClip)">
      <text x="74" y="227" font-family="'SF Mono','JetBrains Mono',Consolas,monospace"
            font-size="18" fill="#8B97AD">building systems that stay fast</text>
    </g>
    <rect x="466" y="211" width="9" height="19" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="x" values="76;76;466;466;76"
               keyTimes="0;0.08;0.52;0.92;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <text x="74" y="284" font-family="'SF Mono','JetBrains Mono',Consolas,monospace"
          font-size="13" letter-spacing="2.5" fill="#4B5468">
      LANTRASOFT &#160;·&#160; BENGALURU, IN
    </text>

    <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.7">
      <path d="M30 44 L30 24 L50 24"/>
      <path d="M1170 296 L1170 316 L1150 316"/>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="none" stroke="#1E2536"/>
  </g>
</svg>
